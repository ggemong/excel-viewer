<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- viewport-fit=cover가 있어야 env(safe-area-inset-*)가 0이 아닌 실제 값을 돌려준다(노치 대응). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="파일을 서버에 올리지 않고 브라우저 안에서 바로 여는 엑셀 뷰어. withvibe." />
    <title>엑셀뷰어 · withvibe</title>

    <!-- 홈 화면에 추가 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 두 값은 src/styles/tokens.css의 --bg(light-dark) 라이트/다크와 같아야 한다. -->
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141211" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="엑셀뷰어" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
